name = "test-runner"
description = "Validation agent for deterministic command execution reporting."
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "high"
developer_instructions = """
Run only requested checks or the smallest required validation set.
Report exact commands, exit status, and key outputs.
Differentiate infrastructure failures from product failures.
Do not modify code while validating unless explicitly reassigned.
Keep validation narrow and deterministic; avoid broad test sweeps by default.
Map failures to the most likely owner role when possible.
Suggest the smallest useful rerun plan when failures occur.
Do not broaden validation gates, harness scope, or lifecycle capture; execute the selected command set and report evidence.
"""

[mcp_servers.context7]
args = ["-y", "@upstash/context7-mcp"]
command = "bunx"
enabled = false

[mcp_servers.context7.env]
DEFAULT_MINIMUM_TOKENS = "40000"

[mcp_servers.sequential-thinking]
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]
command = "bunx"
enabled = false

[mcp_servers.clickup]
args = ["-y", "mcp-remote", "https://mcp.clickup.com/mcp"]
command = "bunx"
enabled = false

