interface:
  display_name: "Goal Context"
  short_description: "Audit or repair a resolved Goal Brief, then return one fenced goal launch context."
  default_prompt: "$goal-context Resolve the target Goal Brief path from the user's request or existing root GOAL.md; if no target can be resolved, ask for the path or inline-output format. Audit the resolved Goal Brief against its sources/repo state, revise it if requested or needed by the task, ensure Claim Boundary, Metric Type, Evaluator Contract, Stop Or Escalate, and authoritative completion audit are present, then return one concise fenced goal_launch_context whose first line is a /goal command using the brief's Objective and pointing to the resolved Goal Brief path as the acceptance brief: "

policy:
  allow_implicit_invocation: false
